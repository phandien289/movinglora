; PlatformIO Project Configuration File for ESP32-S3 LoRa Omni Robot (Master - Slave)
; MCU: ESP32-S3 (4D Systems GEN4 / DevKitC-1 N16R8)

[platformio]
default_envs = master

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; Môi trường biên dịch và nạp cho Node Master (Tay cầm TM1638 + LoRa E32)
[env:master]
build_src_filter = +<master.cpp> -<slave.cpp> -<main.cpp>

; Môi trường biên dịch và nạp cho Node Slave (Robot 3 bánh Omni + LoRa E32)
[env:slave]
build_src_filter = +<slave.cpp> -<master.cpp> -<main.cpp>
